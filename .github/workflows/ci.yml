name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e . pytest ruff
      - run: ruff check src tests
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: install wheel into a clean venv and run the demo
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl pytest
          PATH=/tmp/clean/bin:$PATH PYTHON=/tmp/clean/bin/python examples/demo.sh | tee demo.txt
          grep -q GOALPOST_MOVED demo.txt
