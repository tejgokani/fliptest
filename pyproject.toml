[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fliptest"
version = "0.1.0"
description = "Catch coding agents (and humans) that make tests pass by changing the tests: run old tests on new code and new tests on old code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Tej Gokani" }]
keywords = ["testing", "git", "coding-agents", "reward-hacking", "ci", "claude-code", "codex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tejgokani/fliptest"
Issues = "https://github.com/tejgokani/fliptest/issues"

[project.scripts]
fliptest = "fliptest.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/fliptest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E701"]
